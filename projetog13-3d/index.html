<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171513">
  <title>Ágora · Casa G13 em 3D</title>
  <link rel="stylesheet" href="viewer.css?v=cenas-r07-2">
  <script type="module" src="app.js?v=cenas-r07-2"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">ÁGORA <span>CONSTRUTORA</span></div>
    <div class="title"><span>016 · SMART CITY SALTO</span><strong>Casa G13 em 3D</strong></div>
    <a class="pdf" href="../projetog13-tour/">Visita 360° <span>↗</span></a>
  </header>
  <main>
    <div id="viewport" aria-label="Modelo tridimensional navegável da Casa G13">
      <div id="status" role="status">Carregando a Casa G13…</div>
    </div>
    <aside id="panel" class="panel" aria-label="Controles da apresentação" inert>
      <label class="scene-label" for="scene-select">CENAS DO SKETCHUP</label>
      <select id="scene-select" aria-label="Cenas do SketchUp"><option>Carregando…</option></select>
      <div class="scene-nav"><button id="scene-prev" aria-label="Cena anterior">‹ Anterior</button><button id="scene-next" aria-label="Próxima cena">Próxima ›</button></div>
      <div class="actions canvas-tools" inert><button id="fit">Enquadrar</button><button id="plus" aria-label="Aumentar zoom">＋</button><button id="minus" aria-label="Diminuir zoom">−</button></div>
      <div class="views"><button data-view="geral" id="geral" aria-pressed="true">Vista geral</button><button data-view="top" id="top" aria-pressed="false">Superior</button></div>
      <button id="panel-toggle" aria-expanded="false" aria-controls="settings">Etiquetas e exibição <span aria-hidden="true">⌄</span></button>
      <div id="settings">
        <div class="tag-heading"><strong>Etiquetas</strong><span id="tag-count"></span></div>
        <div class="tag-tools"><button id="show-all">Mostrar todas</button><button id="hide-all">Ocultar todas</button></div><div id="tags"></div>
        <label class="check"><input type="checkbox" id="cut">Corte horizontal</label>
        <label class="slider-label" for="height">Altura do corte <output id="cut-label"></output></label><input type="range" id="height" min="0" max="100" step="0.5" value="75" disabled>
        <label class="check"><input type="checkbox" id="edges" checked>Arestas pretas</label>
        <label class="slider-label" for="width">Espessura <output id="width-label">1,6 px</output></label><input type="range" id="width" min="0.6" max="3" step="0.1" value="1.6">
      </div>
      <p class="help">Arraste para girar. Use a roda do mouse ou a pinça para aproximar.</p>
    </aside>
  </main>
</body></html>
