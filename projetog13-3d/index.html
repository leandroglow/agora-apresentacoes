<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20352b">
  <title>Casa G13 em 3D · Ágora Construtora</title>
  <meta name="description" content="Explore o modelo arquitetônico da Casa G13 em Smart City Salto. Navegue pelas vistas, ajuste o corte e consulte as etiquetas do SketchUp.">
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><div class="identity"><span class="brand">ÁGORA<small>CONSTRUTORA</small></span><div class="heading"><h1>Casa G13 <span>/</span> Modelo 3D</h1><p>Smart City Salto · Arquitetura R18 · SketchUp R07</p></div></div><a href="../projetog13-tour/">Visita 360° ↗</a></header>
  <main>
    <div id="viewport" aria-label="Visualização tridimensional da Casa G13"><div id="status" role="status">Carregando o modelo…</div><div class="canvas-tools" inert><button id="fit">Enquadrar</button><div class="zoom"><button id="minus" aria-label="Diminuir zoom">−</button><button id="plus" aria-label="Aumentar zoom">+</button></div></div><p class="hint">Arraste para girar · Use a roda ou a pinça para ampliar</p></div>
    <aside id="panel" aria-label="Controles do modelo" inert>
      <button id="panel-toggle" aria-expanded="false" aria-controls="settings">Vistas e etiquetas <span aria-hidden="true">⌃</span></button>
      <div id="settings">
        <section><h2>Vistas</h2><div class="views" aria-label="Vistas do modelo"><button data-view="geral" id="geral" aria-pressed="true">Geral</button><button data-view="fachada" id="fachada" aria-pressed="false">Fachada</button><button data-view="top" id="top" aria-pressed="false">Superior</button><button data-view="piscina" id="piscina" aria-pressed="false">Piscina</button></div></section>
        <section><h2>Exibição</h2><label class="check"><input type="checkbox" id="cut">Corte horizontal</label><label class="slider-label" for="height">Altura do corte <output id="cut-label"></output></label><input type="range" id="height" min="0" max="100" step="0.5" value="75" disabled><label class="check edges"><input type="checkbox" id="edges" checked>Arestas pretas</label><label class="slider-label" for="width">Espessura <output id="width-label">1,6 px</output></label><input type="range" id="width" min="0.6" max="3" step="0.1" value="1.6"></section>
        <section class="tag-section"><div class="tag-heading"><h2>Etiquetas</h2><span id="tag-count"></span></div><div class="tag-tools"><button id="show-all">Mostrar todas</button><button id="hide-all">Ocultar todas</button></div><div id="tags"></div></section>
      </div>
    </aside>
  </main>
</body></html>
