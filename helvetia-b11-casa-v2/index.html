<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>Ágora · Helvetia B11 · Casa inteira V2</title><meta name="description" content="Comparação interativa da planta existente e proposta, com demolições e construções do executivo REV00."><link rel="stylesheet" href="styles.css"></head>
<body><main>
<header><a class="brand" href="https://apresentacoes.agoracons.com.br/helvetia-b11-piscina/">ÁGORA <span>/ ENGENHARIA</span></a><h1>Helvetia Park II · B11</h1><p>Casa inteira · Antiga e nova</p><a class="back" href="https://apresentacoes.agoracons.com.br/helvetia-b11-piscina/">Ver piscina ↗</a></header>
<section class="card viewer" id="viewer" aria-label="Comparador de plantas">
<div class="viewer-head"><div><h2>Plantas</h2></div><button id="expand" aria-expanded="false">Ampliar tela</button></div>
<label class="mode-label" for="mode">Visualização</label>
<select id="mode"><option value="compare">Antiga + nova · sobreposição</option><option value="old">Planta antiga</option><option value="new">Planta nova</option><option value="demolition">Demolição</option><option value="construction">Construção</option><option value="interventions">Demolição + construção</option></select>
<div class="layer-controls" id="compare-controls"><div class="control"><label><input type="checkbox" id="show-old" checked><span class="dot old"></span>Antiga</label><label class="range-label" for="alpha-old">Intensidade <output id="value-old">100%</output></label><input type="range" id="alpha-old" min="0" max="100" value="100" aria-label="Transparência da planta antiga"></div><div class="control"><label><input type="checkbox" id="show-new" checked><span class="dot new"></span>Nova</label><label class="range-label" for="alpha-new">Intensidade <output id="value-new">80%</output></label><input type="range" id="alpha-new" min="0" max="100" value="80" aria-label="Transparência da planta nova"></div></div>
<div class="toolbar"><div class="zoom-tools"><button id="minus" aria-label="Diminuir zoom">−</button><output id="zoom-value">100%</output><button id="plus" aria-label="Aumentar zoom">+</button><button id="fit">Enquadrar</button></div><a id="original-link" href="assets/sobreposicao.webp" target="_blank" rel="noopener">Abrir planta ↗</a></div>

<div class="viewport" id="viewport" tabindex="0" aria-label="Planta ampliável. Use os botões de zoom e arraste para navegar."><div class="stage" id="stage"><img id="old-layer" src="assets/antiga.webp" width="5010" height="2385" alt="Planta existente alinhada, em terracota"><img id="new-layer" src="assets/nova.webp" width="5010" height="2385" alt="Planta proposta alinhada, em azul"><img id="demolition-layer" data-src="assets/demolir.webp" alt="Prancha de demolição com as cores originais" hidden><img id="construction-layer" data-src="assets/construir.webp" alt="Prancha de construção com as cores originais" hidden><img id="base-layer" data-src="assets/referencia.webp" alt="Referência cinza da prancha antiga, sem classificação automática de permanência" hidden><img id="remove-layer" data-src="assets/retirar.webp" alt="Destaques vermelhos da prancha de demolição" hidden><img id="build-layer" data-src="assets/executar.webp" alt="Destaques azuis da prancha de construção" hidden></div></div>
</section>


<footer>Ágora · Engenharia</footer>
</main><script src="app.js"></script></body></html>
