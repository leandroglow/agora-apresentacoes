<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<body class="control-app">
  <a class="skip-link" href="#controls" hidden>Ir para os comandos</a>
  <div class="ambient-house" aria-hidden="true"><img id="houseModel" src="assets/casa-agora.png" width="1672" height="941" alt="" fetchpriority="high"></div>
  <section id="loginGate" class="login-gate" aria-label="Entrar na automação ÁGORA">
    <div class="login-shell">
      <div class="login-brand"><span class="mark">Á</span><span>ÁGORA<small>CONSTRUTORA</small></span></div>
      <div id="signInMount" class="login-form"></div>
      <p id="loginNotice" class="notice" role="status" hidden></p>
    </div>
  </section>
  <header class="masthead" hidden>
    <a class="brand" href="./" aria-label="Ágora Construtora — início"><span class="mark">Á</span><span>ÁGORA<small>CONSTRUTORA</small></span></a>

  <main class="page" hidden>
    <section class="residence" aria-labelledby="locationTitle">

      <p id="notice" class="notice" role="status" hidden></p>
      <div id="deviceGrid" class="device-grid"></div>
    </section>
